# Optional testing override for running Vertex AI with a JSON service-account
# key instead of the VM metadata server credentials. Never commit the key file.
services:
  backend-api:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/vertex-service-account.json
    volumes:
      - type: bind
        source: ${VERTEX_SERVICE_ACCOUNT_FILE:?Set VERTEX_SERVICE_ACCOUNT_FILE to the host path of the service-account JSON file}
        target: /run/secrets/vertex-service-account.json
        read_only: true
        bind:
          create_host_path: false

  backend-worker:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/vertex-service-account.json
    volumes:
      - type: bind
        source: ${VERTEX_SERVICE_ACCOUNT_FILE:?Set VERTEX_SERVICE_ACCOUNT_FILE to the host path of the service-account JSON file}
        target: /run/secrets/vertex-service-account.json
        read_only: true
        bind:
          create_host_path: false
